[project]
name = "agentfox"
version = "0.1.0"
description = "Lightweight anti-detect browser for agents — AdsPower for AI agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Public PyPI package; for local dev with patched camoufox: pip install -e /path/to/camoufox
# Camoufox Juggler breaks on playwright>=1.61 (daijro#653) — pin upper bound
camoufox = ["cloverlabs-camoufox[geoip]>=0.6", "playwright>=1.50,<1.61"]
patchright = ["patchright>=1.50,<1.61"]
all = ["cloverlabs-camoufox[geoip]>=0.6", "playwright>=1.50,<1.61", "patchright>=1.50,<1.61", "zstandard>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "behavior", "tools"]

[tool.hatch.build.targets.sdist]
packages = ["core", "api", "behavior", "tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
